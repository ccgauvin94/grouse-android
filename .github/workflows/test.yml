# Continuous test: JVM unit tests on every push/PR. Badge:
# https://github.com/ccgauvin94/grouse-android/actions/workflows/test.yml/badge.svg
#
# The suite is JVM-only (no emulator, no Robolectric): it defends the ACP wire contracts —
# parsers, dispatch, extension DTO conversion, push envelopes, request framing — that have
# bitten repeatedly. See app/src/test/java/id/gauvin/grouse/.
name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
