# Continuous build: assemble the debug APK on every push/PR so a broken commit is caught
# immediately, not at release time. Badge: https://github.com/ccgauvin94/grouse-android/actions/workflows/ci.yml/badge.svg
#
# Separate from test.yml so the build and test badges can each fail independently; both share
# the Gradle dependency cache via gradle/actions/setup-gradle. No secrets are needed here.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug
