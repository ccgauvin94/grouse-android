<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="-apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b98a5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3ddc84"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7aa2f7"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#0f141a"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="600" fill="#e6edf3">Grouse and goose roam federation</text>
  <text x="40" y="68" font-size="13" fill="#8b98a5">One ACP connection to the home server; sessions on other machines appear in it with rewritten ids.</text>

  <!-- ============ phone ============ -->
  <rect x="40" y="110" width="240" height="360" rx="14" fill="#1a222c" stroke="#2c3947"/>
  <text x="60" y="140" font-size="15" font-weight="600" fill="#3ddc84">Grouse</text>
  <text x="60" y="158" font-size="12" fill="#8b98a5">Android · ACP client</text>

  <!-- mock drawer -->
  <rect x="60" y="176" width="200" height="272" rx="8" fill="#0f141a" stroke="#2c3947"/>
  <text x="74" y="200" font-size="10" letter-spacing="1.5" fill="#8b98a5">CHATS</text>
  <rect x="70" y="210" width="180" height="24" rx="5" fill="#1a222c"/>
  <text x="80" y="226" font-size="12" fill="#e6edf3">Assistant</text>
  <rect x="70" y="240" width="180" height="24" rx="5" fill="#1a222c"/>
  <text x="80" y="256" font-size="12" fill="#e6edf3">kitchen lights automation</text>
  <text x="74" y="292" font-size="10" letter-spacing="1.5" fill="#8b98a5">REMOTE</text>
  <rect x="70" y="302" width="180" height="24" rx="5" fill="#1f2c26"/>
  <!-- globe glyph -->
  <circle cx="84" cy="314" r="6" fill="none" stroke="#3ddc84" stroke-width="1.3"/>
  <ellipse cx="84" cy="314" rx="2.6" ry="6" fill="none" stroke="#3ddc84" stroke-width="1"/>
  <line x1="78" y1="314" x2="90" y2="314" stroke="#3ddc84" stroke-width="1"/>
  <text x="96" y="318" font-size="12" fill="#e6edf3">workstation · 9</text>
  <rect x="70" y="332" width="180" height="24" rx="5" fill="#1a222c"/>
  <text x="86" y="348" font-size="12" fill="#8b98a5">└ paper figures redo</text>
  <rect x="70" y="362" width="180" height="24" rx="5" fill="#1a222c"/>
  <text x="86" y="378" font-size="12" fill="#8b98a5">└ cluster job watch</text>
  <text x="74" y="428" font-size="11" fill="#556270">Remote chats get the globe; model picker,</text>
  <text x="74" y="443" font-size="11" fill="#556270">tools, rename, delete all work in place.</text>

  <!-- phone -> home server -->
  <line x1="280" y1="228" x2="360" y2="228" stroke="#3ddc84" stroke-width="1.6" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreen)"/>
  <text x="320" y="212" font-size="11" fill="#3ddc84" text-anchor="middle">wss /acp</text>
  <text x="320" y="248" font-size="10" fill="#8b98a5" text-anchor="middle">secret key ·</text>
  <text x="320" y="261" font-size="10" fill="#8b98a5" text-anchor="middle">the only connection</text>

  <!-- ============ home server ============ -->
  <rect x="360" y="90" width="330" height="400" rx="14" fill="#1a222c" stroke="#2c3947"/>
  <text x="380" y="120" font-size="15" font-weight="600" fill="#e6edf3">home server</text>
  <text x="380" y="138" font-size="12" fill="#8b98a5">goose serve (container) · the only server the phone knows</text>

  <rect x="380" y="154" width="290" height="52" rx="8" fill="#0f141a" stroke="#2c3947"/>
  <text x="396" y="176" font-size="13" font-weight="600" fill="#e6edf3">ACP server</text>
  <text x="396" y="194" font-size="11" fill="#8b98a5">local sessions answered here directly</text>

  <line x1="525" y1="206" x2="525" y2="228" stroke="#8b98a5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="537" y="222" font-size="10" fill="#556270">session id starts with roam:</text>

  <rect x="380" y="230" width="290" height="104" rx="8" fill="#0f141a" stroke="#f5a623"/>
  <text x="396" y="252" font-size="13" font-weight="600" fill="#f5a623">federation</text>
  <text x="396" y="271" font-size="11" fill="#8b98a5">rewrites the session id at the boundary:</text>
  <text x="396" y="291" font-size="11.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#e6edf3">roam:workstation:20260804_1</text>
  <text x="396" y="309" font-size="11.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#8b98a5">⇅  20260804_1</text>
  <text x="396" y="326" font-size="10" fill="#556270">merges peers' session lists into every reply</text>

  <line x1="525" y1="334" x2="525" y2="356" stroke="#8b98a5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="380" y="358" width="290" height="52" rx="8" fill="#0f141a" stroke="#2c3947"/>
  <text x="396" y="380" font-size="13" font-weight="600" fill="#e6edf3">goose roam bridge workstation</text>
  <text x="396" y="398" font-size="11" fill="#8b98a5">child process · plain ACP on stdio</text>

  <text x="380" y="440" font-size="10" fill="#556270">One bridge per federated peer, supervised and</text>
  <text x="380" y="454" font-size="10" fill="#556270">reconnected with backoff. A dead or slow peer times</text>
  <text x="380" y="468" font-size="10" fill="#556270">out and drops from the list; it never wedges the server.</text>

  <!-- home server -> workstation -->
  <line x1="690" y1="384" x2="790" y2="384" stroke="#7aa2f7" stroke-width="1.6" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <text x="740" y="368" font-size="11" fill="#7aa2f7" text-anchor="middle">iroh</text>
  <text x="740" y="404" font-size="10" fill="#8b98a5" text-anchor="middle">QUIC · end-to-end</text>
  <text x="740" y="417" font-size="10" fill="#8b98a5" text-anchor="middle">encrypted · NAT-traversing</text>

  <!-- ============ workstation ============ -->
  <rect x="790" y="110" width="250" height="360" rx="14" fill="#1a222c" stroke="#2c3947"/>
  <text x="810" y="140" font-size="15" font-weight="600" fill="#e6edf3">workstation</text>
  <text x="810" y="158" font-size="12" fill="#8b98a5">another machine · goose roam share</text>

  <rect x="810" y="176" width="210" height="150" rx="8" fill="#0f141a" stroke="#2c3947"/>
  <text x="826" y="198" font-size="13" font-weight="600" fill="#e6edf3">its own goose agent</text>
  <rect x="822" y="210" width="186" height="22" rx="5" fill="#1a222c"/>
  <text x="832" y="225" font-size="11.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#8b98a5">20260804_1</text>
  <rect x="822" y="238" width="186" height="22" rx="5" fill="#1a222c"/>
  <text x="832" y="253" font-size="11.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#8b98a5">20260805_3</text>
  <rect x="822" y="266" width="186" height="22" rx="5" fill="#1a222c"/>
  <text x="832" y="281" font-size="11.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#8b98a5">20260806_1</text>
  <text x="826" y="312" font-size="10" fill="#556270">sessions, models, tools all live here</text>

  <text x="810" y="356" font-size="11" fill="#8b98a5">Pairing is explicit and one-way:</text>
  <text x="810" y="374" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#e6edf3">roam peers add</text>
  <text x="916" y="374" font-size="11" fill="#8b98a5">on the dialer,</text>
  <text x="810" y="392" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#e6edf3">roam peers accept</text>
  <text x="932" y="392" font-size="11" fill="#8b98a5">on the host.</text>
  <text x="810" y="410" font-size="10" fill="#556270">Cards are addresses, not secrets — only</text>
  <text x="810" y="424" font-size="10" fill="#556270">accept grants access.</text>

  <!-- ============ footer: what routes ============ -->
  <line x1="40" y1="516" x2="1040" y2="516" stroke="#2c3947"/>
  <text x="40" y="544" font-size="11" letter-spacing="1.5" fill="#8b98a5">ROUTED TO THE PEER</text>
  <text x="40" y="566" font-size="12" fill="#e6edf3">list · load · prompt · cancel · model / mode / effort · rename · archive · delete · tools and session extensions</text>
  <text x="40" y="600" font-size="11" letter-spacing="1.5" fill="#8b98a5">REFUSED</text>
  <text x="40" y="622" font-size="12" fill="#8b98a5">fork · steer · anything touching the peer's global config — refused with an error, never half-forwarded</text>
</svg>
